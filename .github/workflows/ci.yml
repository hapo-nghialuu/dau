name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  macos:
    name: macOS core and app tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Test macOS app
        run: xcodebuild test -project platforms/macos/Dau.xcodeproj -scheme Dau -destination 'platform=macOS'

  deb:
    name: deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            extra-cmake-modules \
            fcitx5 \
            libfcitx5core-dev \
            libfcitx5config-dev \
            libfcitx5utils-dev \
            libxkbcommon-dev

      - name: Package .deb
        run: bash scripts/package-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dau-deb
          path: dist/*
          retention-days: 14
