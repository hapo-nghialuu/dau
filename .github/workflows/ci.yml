name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Test
        run: cargo test

  linux-addon:
    name: linux-addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Fcitx5 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            pkg-config \
            extra-cmake-modules \
            fcitx5 \
            libfcitx5core-dev \
            libfcitx5config-dev \
            libfcitx5utils-dev \
            libxkbcommon-dev
      - name: Locate fcitx5 headers (diagnostic)
        run: |
          echo "=== dpkg text.h/inputpanel ==="
          dpkg -L libfcitx5utils-dev | grep -E "text.h|textformatflags" || true
          dpkg -L libfcitx5core-dev | grep -E "inputpanel.h" || true
          echo "=== find text.h under /usr ==="
          find /usr -name "text.h" -path "*fcitx*" 2>/dev/null || true
          echo "=== find fcitx-utils dir ==="
          find /usr -type d -name "fcitx-utils" 2>/dev/null || true
      - name: Configure & build Fcitx5 addon
        run: |
          cd platforms/linux
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --verbose
      - name: Unit tests (TypingController, no fcitx5 runtime)
        run: |
          cd platforms/linux
          ctest --test-dir build --output-on-failure
