<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8342A"/>
      <stop offset="0.55" stop-color="#DA251D"/>
      <stop offset="1" stop-color="#F4791F"/>
    </linearGradient>
  </defs>
  <!-- rounded-square app icon -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <!-- acute tone mark (dấu sắc) -->
  <rect x="556" y="214" width="150" height="54" rx="27" transform="rotate(-32 631 241)" fill="#FFFFFF"/>
  <!-- lowercase letter d -->
  <g fill="#FFFFFF">
    <!-- bowl -->
    <circle cx="452" cy="620" r="170" fill="none" stroke="#FFFFFF" stroke-width="96"/>
    <!-- stem -->
    <rect x="590" y="300" width="96" height="500" rx="10"/>
  </g>
</svg>
