# Dấu macOS — shipped injection profiles (bridge-owned, MVP).
# Loaded by InjectionProfileStore from the app bundle resource `profiles.toml`.
# User overrides live in UserDefaults and always win at resolve time.
#
# Precedence: user override > shipped [[apps]] > AX role fallback > [default]
# Default MVP: backspaceFast + zero delays.
#
# Shipped rows exist ONLY where bundle-specific behavior is necessary for
# developer surfaces (terminals, Electron code editors). Apps without a row —
# including browser host apps (Safari / Chrome / Chromium) — fall back to the
# AX role policy in InjectionProfileResolver (editor/textarea → charByChar,
# combo/search → selection, address bar → emptyCharPrefix, terminal/textField →
# backspaceFast). When browser AX focus is inconclusive, the resolver uses a
# browser-specific charByChar fallback. A broad browser bundle row would shadow
# addressBar/editor role policy, so browser handling stays in the resolver.

[default]
enabled = true
injection_method = "backspaceFast"
backspace_us = 0
settle_us = 0
text_us = 0

# --- Terminals / AI CLI hosts (north star) ---
# Zero delays: ordering vs. physical keys is guaranteed by session-tap posting
# (private event source), and destructive injects must stay under the 12ms
# callback budget — usleep on the session queue oversleeps several ms per call,
# so any non-zero delay recipe (even 1000/3000/1000) blows the budget.

[[apps]]
bundle_id = "com.apple.Terminal"
enabled = true
injection_method = "backspaceFast"
backspace_us = 0
settle_us = 0
text_us = 0

