# cbindgen config for dau-core C ABI header.
# Types/functions already use the Dau / dau_ prefix in Rust sources.

language = "C"
include_guard = "DAU_CORE_H"
autogen_warning = "/* Generated by cbindgen from dau-core. Do not edit by hand. */"
include_version = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
cpp_compat = true
# Name prefix convention: Dau* types / dau_* functions (set in Rust sources).
# prefix = "Dau" would double-prefix those names, so left unset.

[export]
include = ["DauMethod", "DauAction", "DauDeltaResult", "DauStrategy", "Engine"]
exclude = ["Method", "BreakOutput", "Strategy", "Config", "DisplayDelta"]

[parse]
parse_deps = false
include = ["dau_core"]

[fn]
sort_by = "Name"

[enum]
rename_variants = "None"
# Prefix variants as DauAction_None, DauMethod_Telex, … to avoid X11 `#define None`.
prefix_with_name = true
