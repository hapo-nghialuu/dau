[package]
name = "dau-core"
version = "0.1.11"
edition = "2021"
license = "MIT"
description = "Dấu — Vietnamese input method core engine"
repository = "https://github.com/hapo-nghialuu/dau"
homepage = "https://github.com/hapo-nghialuu/dau"
readme = "../README.md"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Config is off the keystroke hot-path; single TOML parser for shipped + user files.
toml = "0.8"

[build-dependencies]
cbindgen = "0.27"
